# OpenManus configuration for Google Gemini (free tier, OpenAI-compatible API)
#
# This file is kept for backwards compatibility; see
# config/config.example-model-gemini.toml for the up to date version.
#
# Copy to config/config.toml and fill in your key:
#     cp config/config.example-model-gemini.toml config/config.toml
#
#     export GEMINI_API_KEY="AIza..."
#
[llm]
model = "gemini-2.5-flash"                                              # The LLM model to use
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"   # API endpoint URL
api_key = "${GEMINI_API_KEY}"                                           # API key
temperature = 0.0                                                       # Controls randomness
max_tokens = 8192                                                       # Maximum number of tokens in the response
supports_images = true                                                  # Every Gemini model accepts image input


# Optional configuration for specific LLM models for Google
[llm.vision]
model = "gemini-2.5-flash"                                            # The vision model to use
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"  # API endpoint URL for vision model
api_key = "${GEMINI_API_KEY}"                                          # API key for vision model
max_tokens = 8192                                                     # Maximum number of tokens in the response
temperature = 0.0                                                     # Controls randomness for vision model
supports_images = true
